name: CD Pipeline, Deploy to Target Server

on:
  # CD 流水线触发方式
  workflow_dispatch: # 手动点击触发
  workflow_run:
    # 当 CI 流水线成功完成后自动触发
    workflows: ["CI Pipeline, To GitHub Container Registry"]
    types:
      - completed

concurrency:
  group: production-deploy
  cancel-in-progress: false

# 定义环境变量
env:
  REGISTRY: ghcr.io # GitHub Container Registry
  IMAGE_NAME: ${{ github.repository }} # 系统环境变量，所在 GitHub 仓库名
  SERVER_DIR: ~/AgentProjects/xiaolin-docs
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-to-server:
    # 仅在 CI 成功完成时运行
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to target server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 30m
          script: |
            set -eu
            cd ${{ env.SERVER_DIR }}
            git pull --ff-only

            # 每个源最多等待 5 分钟；下载成功前保持现有容器运行。
            export DEPLOY_IMAGE=ghcr.io/xiaolinstar/xiaolin-docs:main
            if ! timeout 300 docker pull "$DEPLOY_IMAGE"; then
              export DEPLOY_IMAGE=ghcr.nju.edu.cn/xiaolinstar/xiaolin-docs:main
              timeout 300 docker pull "$DEPLOY_IMAGE"
            fi

            # 代理可能缓存旧标签，拒绝将旧镜像当作本次发布。
            expected_revision="${{ github.event.workflow_run.head_sha || github.sha }}"
            actual_revision=$(docker image inspect "$DEPLOY_IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
            test "$actual_revision" = "$expected_revision"

            # 原地更新，并等待健康检查通过后才报告成功。
            docker compose -f compose.yaml up -d --wait --wait-timeout 120
            docker compose -f compose.yaml exec -T xiaolin-website wget -qO- http://127.0.0.1:8080/healthz >/dev/null
            echo "Deployment completed successfully!"

      - name: Probe production website
        run: |
          curl -4 --fail --show-error --silent --location --retry 3 --retry-delay 5 https://www.xiaolinstar.cn/ >/dev/null
          curl -4 --fail --show-error --silent --location --retry 3 --retry-delay 5 https://www.xiaolinstar.cn/healthz >/dev/null
          curl -4 --fail --show-error --silent --location --retry 3 --retry-delay 5 https://www.xiaolinstar.cn/products/index.md >/dev/null
