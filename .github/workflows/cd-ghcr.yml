name: CD Pipeline, Deploy to Target Server

on:
  # CD 流水线触发方式
  workflow_dispatch: # 手动点击触发
  workflow_run:
    # 当 CI 流水线成功完成后自动触发
    workflows: ["CI Pipeline, To GitHub Container Registry"]
    types:
      - completed

concurrency:
  group: production-deploy
  cancel-in-progress: false

# 定义环境变量
env:
  REGISTRY: ghcr.io # GitHub Container Registry
  IMAGE_NAME: ${{ github.repository }} # 系统环境变量，所在 GitHub 仓库名
  SERVER_DIR: ~/AgentProjects/xiaolin-docs
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-to-server:
    # 仅在 CI 成功完成时运行
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download and package release image
        env:
          EXPECTED_REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/${IMAGE_NAME}:main"
          timeout 300 docker pull "$image"
          actual_revision=$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
          test "$actual_revision" = "$EXPECTED_REVISION"
          docker save "$image" | gzip > release-image.tar.gz

      - name: Transfer release image to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: release-image.tar.gz
          target: /tmp/xiaolin-deploy-${{ github.run_id }}
          command_timeout: 10m

      - name: Deploy to target server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 30m
          script: |
            set -eu
            cd ${{ env.SERVER_DIR }}
            git pull --ff-only

            # Runner 已完成下载，经 SSH 传输后本地加载，绕开服务器的仓库下载链路。
            archive_dir="/tmp/xiaolin-deploy-${{ github.run_id }}"
            trap 'rm -f "$archive_dir/release-image.tar.gz"; rmdir "$archive_dir"' EXIT
            docker load -i "$archive_dir/release-image.tar.gz"
            export DEPLOY_IMAGE=ghcr.io/xiaolinstar/xiaolin-docs:main

            # 再次验证服务器实际加载的镜像版本。
            expected_revision="${{ github.event.workflow_run.head_sha || github.sha }}"
            actual_revision=$(docker image inspect "$DEPLOY_IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
            test "$actual_revision" = "$expected_revision"

            # 原地更新，并等待健康检查通过后才报告成功。
            docker compose -f compose.yaml up -d --wait --wait-timeout 120
            docker compose -f compose.yaml exec -T xiaolin-website wget -qO- http://127.0.0.1:8080/healthz >/dev/null
            echo "Deployment completed successfully!"

      - name: Probe production website
        run: |
          curl -4 --fail --show-error --silent --location --retry 3 --retry-delay 5 https://www.xiaolinstar.cn/ >/dev/null
          curl -4 --fail --show-error --silent --location --retry 3 --retry-delay 5 https://www.xiaolinstar.cn/healthz >/dev/null
          curl -4 --fail --show-error --silent --location --retry 3 --retry-delay 5 https://www.xiaolinstar.cn/products/index.md >/dev/null
