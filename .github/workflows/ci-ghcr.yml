name: CI Pipeline, To GitHub Container Registry

on:
  # 2个 CI 流水线触发方式
  workflow_dispatch: #  手动点击
  push: # 推送分支 release
    branches:
      - 'release'
      - 'main'

# 定义环境变量
env:
  REGISTRY: ghcr.io # GitHub Container Registry
  IMAGE_NAME: ${{ github.repository }} # 系统环境变量，所在 GitHub 仓库名
  VITE_BAIDU_ANALYTICS_ID: ${{ vars.DOCKER_BAIDU_ANALYTICS_ID }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # 强制使用 Node.js 24

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest


    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          version: '11.10.0'
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check local documentation links
        run: pnpm run docs:check-links

      - name: Build documentation
        run: pnpm run docs:build

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          # 3个仓库相关变量，用户无需关注
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}


      # 构建镜像，并推送到 ghcr.io
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        id: push
        with:
          context: .  # 构建上下文，默认为项目更目录下的 Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BAIDU_ANALYTICS_ID=${{ env.VITE_BAIDU_ANALYTICS_ID }}

      # 生成项目证明
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
