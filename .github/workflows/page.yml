name: VitePress-Website Github Pages Deploy
on:
  push: # 方式一：push 到 main 分支
    branches:
      - main
  workflow_dispatch: # 方式二：手动按钮
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
      tags:
        description: 'Test scenario tags'

env:
  TZ: Asia/Shanghai # 上海时区，系统时间和自适应主题
  # 使用 GITHUB Pages 百度统计 ID
  VITE_BAIDU_ANALYTICS_ID: ${{ vars.PAGES_BAIDU_ANALYTICS_ID }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build: # 1. 构建静态站点
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 11
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build documentation
        run: pnpm run docs:build

      - name: Create .nojekyll
        run: touch docs/.vitepress/dist/.nojekyll

      # 通用上传制品 action
#      - name: Upload artifact
#        uses: actions/upload-artifact@v4
#        with:
#          name: artifact # default
#          path: docs/.vitepress/dist

      # 1. 上传 pages 制品
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: 'github-pages' # default
          path: docs/.vitepress/dist

  deploy: # 2. 部署
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      # 2. 部署名为 github-pages 的制品
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
